apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-database
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: payment-database
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: ${DB_SECRET_NAME}
        property: host
    - secretKey: port
      remoteRef:
        key: ${DB_SECRET_NAME}
        property: port
    - secretKey: dbname
      remoteRef:
        key: ${DB_SECRET_NAME}
        property: dbname
    - secretKey: username
      remoteRef:
        key: ${DB_SECRET_NAME}
        property: username
    - secretKey: password
      remoteRef:
        key: ${DB_SECRET_NAME}
        property: password
